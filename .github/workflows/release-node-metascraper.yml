name: Release node-metascraper
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed package version
        required: true
        type: string
      commit:
        description: Exact reviewed master commit SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-node-metascraper
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify reviewed source and unpublished version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pkg = JSON.parse(readFileSync('packages/node-metascraper/package.json', 'utf8'))
          if (!/^[0-9a-f]{40}$/.test(process.env.EXPECTED_COMMIT ?? '') || process.env.EXPECTED_COMMIT !== process.env.GITHUB_SHA) throw new Error('Reviewed commit mismatch')
          if (!/^\d+\.\d+\.\d+$/.test(process.env.EXPECTED_VERSION ?? '') || pkg.version !== process.env.EXPECTED_VERSION || pkg.name !== '@goatlab/node-metascraper') throw new Error('Reviewed package version mismatch')
          const response = await fetch(`https://registry.npmjs.org/@goatlab%2fnode-metascraper/${pkg.version}`, { redirect: 'error', signal: AbortSignal.timeout(15000) })
          if (response.status !== 404) throw new Error(response.ok ? 'Version already published' : 'Unable to verify registry version')
          NODE
      - name: Verify publisher permission
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GOATLAB_NPM_TOKEN }}
        run: |
          node --test .github/scripts/verify-metascraper-publish-access.test.mjs
          node .github/scripts/verify-metascraper-publish-access.mjs
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint package
        run: pnpm --filter @goatlab/node-metascraper exec biome check .
      - name: Build package
        run: pnpm --filter @goatlab/node-metascraper build
      - name: Test package
        run: pnpm --filter @goatlab/node-metascraper test
      - name: Verify source stayed unchanged
        run: git diff --exit-code
      - name: Publish reviewed package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GOATLAB_NPM_TOKEN }}
        run: pnpm --filter @goatlab/node-metascraper publish --no-git-checks --access public
