    <script>
      function slugify(text) {
        return text
          .toString() // Cast to string (optional)
          .normalize('NFKD') // The normalize() using NFKD method returns the Unicode Normalization Form of a given string.
          .toLowerCase() // Convert the string to lowercase letters
          .trim() // Remove whitespace from both sides of a string (optional)
          .replace(/\s+/g, '-') // Replace spaces with -
          .replace(/[^\w\-]+/g, '') // Remove all non-word chars
          .replace(/\-\-+/g, '-')
      }

      const getIndicesOf = (searchStr, str, caseSensitive) => {
        var searchStrLen = searchStr.length
        if (searchStrLen == 0) {
          return []
        }
        var startIndex = 0,
          index,
          indices = []
        if (!caseSensitive) {
          str = str.toLowerCase()
          searchStr = searchStr.toLowerCase()
        }
        while ((index = str.indexOf(searchStr, startIndex)) > -1) {
          indices.push(index)
          startIndex = index + searchStrLen
        }
        return indices
      }

      const uniqueArray = (arr) => {
        return arr.filter(
          (v, i, a) =>
            a.findIndex((v2) => JSON.stringify(v2) === JSON.stringify(v)) === i,
        )
      }

      window.$docsify = {
        onlyCover: false,
        loadSidebar: true,
        // homepage: "",
        alias: {
          '/.*/_sidebar.md': '_sidebar.md',
          // "_sidebar.md": "/0.1.0/_sidebar.md"
          '0.1.0/.*/_sidebar.md': '/_sidebar.md',
        },
        coverpage: ['/', '/es/'],
        // topBanner: {
        //   content: "Something happened!"
        //},
        ga: 'UA-XXXXX-Y',
        toc: {
          scope: '.markdown-section',
          headings: 'h1, h2, h3, h4, h5, h6',
          title: 'Contents',
        },
        plantuml: {
          skin: 'default',
        },
        plugins: [
          function (hook, vm) {
            hook.doneEach(function (html) {
              Prism.highlightAll()
            })
          },
        ],
        markdown: {
          renderer: {
            /* Change code block rendering. Add line-numbers class.*/
            code: function (code, lang) {
              let cc = document.createElement('code')
              cc.textContent = code
              cc.setAttribute('class', `language-${lang}`)
              return (
                '<pre data-lang="' +
                lang +
                '" class="line-numbers">' +
                cc.outerHTML +
                '</pre>'
              )
            },
          },
        },
        logo: './logo.png',
        name: 'Fluent Ecosystem - Docs',
        themeColor: 'var(--accent-color)',
        auto2top: true,
        autoHeader: false,
        maxLevel: 3,
        repo: '',
        search: {
          placeholder: 'Search the docs...',
          noData: 'No results for it. Sorry!',
          templates: {
            resultItem: (result, response, options) => {
              const slug = result.slug.replace(/\/+$/, '')

              // Get highlighted title or fallback to original
              const title =
                result._highlightResult?.title?.value || result.title
              const menu = result.menu || 'Documentation'
              const searchSnippet =
                result._highlightResult?.searchSnippet?.value ||
                result.searchSnippet ||
                ''

              // Handle chunked documents
              const isChunked = result.isChunked || false
              const chunkInfo = isChunked
                ? ` (Part ${result.chunkIndex + 1}/${result.totalChunks})`
                : ''

              // Find the best matching section from highlighted content
              const highlightedContent =
                result._highlightResult?.content?.value || ''
              const highlights =
                highlightedContent.match(/<em>.*?<\/em>/g) || []
              const firstHighlight = highlights[0] || ''

              // Create context snippet from around the first highlight
              let contextSnippet = searchSnippet
              if (firstHighlight && highlightedContent) {
                const highlightIndex =
                  highlightedContent.indexOf(firstHighlight)
                const start = Math.max(0, highlightIndex - 100)
                const end = Math.min(
                  highlightedContent.length,
                  highlightIndex + 200,
                )
                contextSnippet = highlightedContent.substring(start, end)
                if (start > 0) contextSnippet = '...' + contextSnippet
                if (end < highlightedContent.length)
                  contextSnippet = contextSnippet + '...'
              }

              // Clean up context snippet - remove markdown and excessive HTML
              contextSnippet = contextSnippet
                .replace(/#{1,6}\s*/g, '') // Remove markdown headers
                .replace(/\*\*(.*?)\*\*/g, '$1') // Remove bold markdown
                .replace(/`([^`]+)`/g, '$1') // Remove inline code markdown
                .replace(/<(?!em|\/em)[^>]*>/g, '') // Remove HTML except <em> tags
                .trim()

              const url = `#${slug}`

              return `
                <div class="search-result-item">
                  <a href="${url}" data-slug="${slug}">
                    <div class="search-result-header">
                      <div class="search-result-category">${menu}</div>
                      <div class="search-result-title">${title}${chunkInfo}</div>
                    </div>
                    <div class="search-result-snippet">${contextSnippet}</div>
                  </a>
                </div>
              `
            },
          },
          algolia: {
            token: 'fee145b265e08305e3fdbbfa2aef6079',
            appId: 'FNFI485NDK',
            defaultIndex: 'fluent-docs',
            // single index
            indexes: 'fluent-docs',
            // default multi settings
            multi: false,
          },
        },
        tabs: {
          persist: true,
          sync: true,
          theme: 'material',
          tabComments: true,
          tabHeadings: true,
        },
        pagination: {
          previousText: 'Previous',
          nextText: 'Next',

          theme: 'classic',

      }

    <script>
      let active = 0
      const activateSearch = () => {
        const search = document.getElementsByClassName('search')[0]
        const input = document.getElementsByTagName('input')[0]
        const panel = document.getElementsByClassName('results-panel')[0]
        const clearButton = document.getElementsByClassName('clear-button')[0]

        input.addEventListener('input', function (e) {
          if (input.value === '') {
            panel.classList.add('show')
            panel.innerHTML =
              '<p class="empty">Start typing to find results in the documentation.</p>'
          }
        })
        input.addEventListener('focus', function () {
          if (!active) {
            active = 1
            search.classList.add('search-active')
            clearButton.classList.add('show')
            panel.classList.add('show')

            panel.innerHTML =
              '<p class="empty">Enter a search term to find results in the documentation.</p>'
          }
        })

        window.addEventListener('click', function (e) {
          if (search.contains(e.target) || e.target.className === 'sidebar') {
            return
          }

          search.classList.remove('search-active')
          panel.innerHTML = ''
          panel.classList.remove('show')
          clearButton.classList.remove('show')
          input.value = ''
          active = 0
        })

        clearButton.addEventListener('click', function () {
          search.classList.remove('search-active')
          panel.innerHTML = ''
          panel.classList.remove('show')
          clearButton.classList.remove('show')
          input.value = ''
          active = 0
        })
      }

      window.addEventListener('load', function () {
        activateSearch()
      })
    </script>
